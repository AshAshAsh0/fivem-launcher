<!doctype html>
<html lang="th" data-theme="hud" data-motion="full" data-cursor="theme">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src * data: blob:; media-src * data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'" />
  <title>FiveM Launcher</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="splash.js"></script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="sp-bg"></div>
    <div class="sp-word">FIVEM</div>
    <div class="sp-center">
      <div class="sp-logo">
        <span class="sp-ring"></span>
        <span class="sp-spark s1"></span><span class="sp-spark s2"></span><span class="sp-spark s3"></span>
        <svg viewBox="0 0 40 40"><path d="M13 30 21.2 9.5c.5-1.3 2.3-1.3 2.8 0L32 30" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 30h7.5" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><path d="M22.6 21.5v8.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      </div>
      <div class="sp-title">FIVEM <b>LAUNCHER</b></div>
      <div class="sp-status" id="spStatus"></div>
      <div class="sp-tip" id="spTip"></div>
    </div>
    <div class="sp-foot"><span id="spVer"></span></div>
    <div class="sp-bar"><i id="spBar"></i></div>
  </div>
  <div class="shell" id="shell">

    <main class="main">
      <header class="titlebar">
        <div class="brand">
          <div class="mark sm" title="FiveM Launcher">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M13 30 21.2 9.5c.5-1.3 2.3-1.3 2.8 0L32 30" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 30h7.5" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><path d="M22.6 21.5v8.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      </div>
          <span class="brand-name" id="brandName">FiveM</span>
          <span class="brand-tag" id="brandTag">launcher <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"/></svg></span>
        </div>
        <nav class="tabs">
          <button class="nav-btn" data-page="browse" title="หน้าหลัก"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4.5l8 6.7V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19Z"/></svg><span>หน้าหลัก</span></button>
          <button class="nav-btn" data-page="settings" title="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>ตั้งค่า</span></button>
        </nav>
        <div class="win-ctrls">
          <button class="wc wc-fivem" id="btnFiveM" title="เปิด FiveM"><svg viewBox="0 0 24 24"><path d="M7.5 9h9a4.5 4.5 0 0 1 4.3 5.8l-.7 2.4a2.2 2.2 0 0 1-3.7.9L14.7 16H9.3l-1.7 2.1a2.2 2.2 0 0 1-3.7-.9l-.7-2.4A4.5 4.5 0 0 1 7.5 9Z"/><path d="M8 11.5v3M6.5 13h3"/><circle cx="15.5" cy="12" r=".6" fill="currentColor"/><circle cx="17.2" cy="13.8" r=".6" fill="currentColor"/></svg></button>
          <span class="wc-sep"></span>
          <button class="wc wc-min" id="btnMin" title="ย่อหน้าต่าง"><svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg></button>
          <button class="wc wc-close" id="btnClose" title="ปิดหน้าต่าง"><svg viewBox="0 0 24 24"><path d="m8 8 8 8M16 8l-8 8"/></svg></button>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <div class="view" id="view"></div>
      </div>

      <footer class="foot">
        <div class="made">made with <span class="heart">♥</span> by <b id="madeBy">YOU</b></div>
        <button class="discord" id="btnDiscord">
          <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M19.3 5.3A16.6 16.6 0 0 0 15.2 4l-.5 1a15.4 15.4 0 0 0-5.4 0l-.5-1a16.5 16.5 0 0 0-4.1 1.3C2.1 9.2 1.4 13 1.7 16.7a16.7 16.7 0 0 0 5 2.6l1.1-1.7a10.7 10.7 0 0 1-1.7-.8l.4-.3a11.9 11.9 0 0 0 11 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.7a16.6 16.6 0 0 0 5-2.6c.4-4.3-.7-8-3-11.4ZM8.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
          Discord
        </button>
      </footer>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>
  <div class="menu-layer" id="menuLayer"></div>

  <script src="config.js"></script>
  <script src="build-config.js"></script>
  <script src="i18n.js"></script>
  <script src="bridge.js"></script>
  <script src="demo-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
