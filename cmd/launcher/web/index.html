<!doctype html>
<html lang="th" data-theme="mono" data-motion="full" data-cursor="theme">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src * data: blob:; media-src * data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'" />
  <title>FiveM Launcher</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="side">
      <div class="mark" title="FiveM Launcher">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M13 30 21.2 9.5c.5-1.3 2.3-1.3 2.8 0L32 30" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 30h7.5" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><path d="M22.6 21.5v8.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      </div>
      <nav class="nav">
        <button class="nav-btn" data-page="home" title="หน้าหลัก">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>
        </button>
        <button class="nav-btn" data-page="browse" title="ค้นหาเซิร์ฟ">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5Z"/></svg>
        </button>
        <button class="nav-btn" data-page="favorites" title="เซิร์ฟโปรด">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"/></svg>
        </button>
      </nav>
      <div class="nav-spacer"></div>
      <button class="nav-btn" data-page="settings" title="ตั้งค่า">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </aside>

    <main class="main">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-name" id="brandName">FiveM</span>
          <span class="brand-tag" id="brandTag">launcher <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"/></svg></span>
        </div>
        <div class="win-ctrls">
          <button class="wc wc-theme" id="btnTheme" title="สลับธีม">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8h2.1A4.3 4.3 0 0 0 21 10.7C21 6.4 17 3 12 3Z"/><circle cx="7.6" cy="11.2" r="1.2"/><circle cx="10.3" cy="7.4" r="1.2"/><circle cx="14.8" cy="7.6" r="1.2"/></svg>
          </button>
          <button class="wc wc-min" id="btnMin" title="ย่อหน้าต่าง"><svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg></button>
          <button class="wc wc-close" id="btnClose" title="ปิดหน้าต่าง"><svg viewBox="0 0 24 24"><path d="m8 8 8 8M16 8l-8 8"/></svg></button>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <div class="view" id="view"></div>
      </div>

      <footer class="foot">
        <div class="made">made with <span class="heart">♥</span> by <b id="madeBy">YOU</b></div>
        <button class="discord" id="btnDiscord">
          <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M19.3 5.3A16.6 16.6 0 0 0 15.2 4l-.5 1a15.4 15.4 0 0 0-5.4 0l-.5-1a16.5 16.5 0 0 0-4.1 1.3C2.1 9.2 1.4 13 1.7 16.7a16.7 16.7 0 0 0 5 2.6l1.1-1.7a10.7 10.7 0 0 1-1.7-.8l.4-.3a11.9 11.9 0 0 0 11 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.7a16.6 16.6 0 0 0 5-2.6c.4-4.3-.7-8-3-11.4ZM8.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
          Discord
        </button>
      </footer>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>
  <div class="menu-layer" id="menuLayer"></div>

  <script src="config.js"></script>
  <script src="build-config.js"></script>
  <script src="i18n.js"></script>
  <script src="bridge.js"></script>
  <script src="demo-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
